# Lee el .env de la raíz del repo. Se ejecuta desde backend/, por eso sube un nivel.
# optional: si el archivo no existe, la app sigue y falla al no encontrar las claves de abajo.
spring.config.import=optional:file:../.env[.properties]

# Puerto del backend
server.port=${SERVER_PORT:8080}

# Conexión a MySQL (Docker). La contraseña NO tiene valor por defecto:
# sale del .env y debe ser la misma que MYSQL_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canela_miel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:canela}
spring.datasource.password=${DB_PASSWORD}

# JPA: Hibernate crea y actualiza las tablas según las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT: clave y duraciones. Sin clave por defecto: JWT_SECRET sale del .env.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutos=${JWT_ACCESS_MINUTOS:15}
app.jwt.refresh-dias=${JWT_REFRESH_DIAS:7}
