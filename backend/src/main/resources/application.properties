# Puerto del backend
server.port=${SERVER_PORT:8080}

# Conexión a MySQL (Docker). Si no hay variables de entorno se usan estos valores,
# que coinciden con el .env de la raíz.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canela_miel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:canela}
spring.datasource.password=${DB_PASSWORD:canela123}

# JPA: Hibernate crea y actualiza las tablas según las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT: clave y duraciones (en producción, JWT_SECRET va en una variable de entorno)
app.jwt.secret=${JWT_SECRET:canela-miel-clave-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.access-minutos=${JWT_ACCESS_MINUTOS:15}
app.jwt.refresh-dias=${JWT_REFRESH_DIAS:7}
